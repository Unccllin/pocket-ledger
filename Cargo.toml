# Workspace skeleton. Agents: add members as each crate is created, and PIN every
# dependency to an exact version (e.g. apalis = "=x.y.z") after reading current docs.
[workspace]
resolver = "2"
members = ["crates/ledger-core", "crates/ledger-worker", "crates/ledger-jni"]

[workspace.package]
edition = "2021"
rust-version = "1.92"
