[package]
name = "ledger-jni"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Android JNI bridge: Rivium's five-method ABI plus enqueue/stats"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Android gets the embedded host only: the process host's signal handling is a
# laptop concern and Rivium's docs say not to select both hosts.
ledger-worker = { path = "../ledger-worker", default-features = false }
rivium-host = { version = "=0.2.0", default-features = false, features = ["embedded"] }
rivium-jni = { version = "=0.2.0" }
jni = { version = "=0.22.4", default-features = false }
serde = "=1.0.229"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "time"] }
